[project]
name = "microsoft-mcp"
version = "0.1.0"
description = "Microsoft Graph MCP server for Outlook, Calendar, and OneDrive with multi-account support"
readme = "README.md"
authors = [
    { name = "elyx", email = "elio@pascarelli.com" }
]
requires-python = ">=3.12"
dependencies = [
    # 3.2.0 is the floor for GHSA-vv7q-7jx5-f767 (critical) and
    # GHSA-rww4-4w9c-7733 (high). Capped below 4 so the next major is a
    # deliberate migration, not an accidental resolve (mcp-m4e).
    "fastmcp>=3.2.0,<4",
    "httpx>=0.28.1",
    "msal>=1.32.3",
    "python-dotenv>=1.1.0",
]

[project.scripts]
microsoft-mcp = "microsoft_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp>=1.9.3",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
    "pyright>=1.1.408",
]
