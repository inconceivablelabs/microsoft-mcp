name: Quality

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Sets UV_PYTHON. Pinned to match Dockerfile's python:3.12-slim so CI
          # cannot silently test on a newer interpreter than we ship (mcp-t66.4).
          python-version: "3.12"

      - name: Set up Python
        # No argument: installs the version pinned in .python-version.
        run: uv python install

      - name: Install dependencies
        # --locked errors on a stale uv.lock instead of silently re-locking, so a
        # pyproject edit without a matching lock update fails the gate (mcp-t66.3).
        run: uv sync --all-extras --locked

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format --check
        run: uv run ruff format --check src/ tests/

      - name: pyright (src/ + tests/)
        run: uv run pyright src/ tests/
